<!DOCTYPE html>
<html>

    <head>

        <title>Contact Form</title>

        <link rel="stylesheet" href="../css/style.css">

    </head>

    <body>

        <div class="container">

            <h1>Contact Us</h1>

            <p>
                Please fill out the form below to contact the Cyber Security Team.
            </p>

            <form action="index.html" method="POST">

                <label>Full Name</label>

                <input
                type="text"
                name="fullname"
                placeholder="Enter your full name"
                required>

                <label>Email Address</label>

                <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>

                <label>Subject</label>

                <input
                type="text"
                name="subject"
                placeholder="Enter subject">

                <label>Message</label>

                <textarea
                name="message"
                rows="6"
                placeholder="Write your message here..."
                required></textarea>

                <button type="submit">

                    Send Message

                </button>

            </form>

            <div class="footer">

                Cyber Security Assignment 1 | Contact Form

            </div>

        </div>

    </body>

</html>
